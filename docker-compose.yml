# One service (D30): the API also serves the built web app at / (D21). PRD "Packaging".
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: yomikoe:latest
    ports:
      - "8765:8765"
    volumes:
      - yomikoe_data:/data
      - hf_home:/hf_home
    environment:
      YOMIKOE_DATA_DIR: /data
      YOMIKOE_WEB_DIST: /app/web/dist
      YOMIKOE_TTS_BACKEND: kokoro
      YOMIKOE_KOKORO_REVISION: f3ff3571791e39611d31c381e3a41a3af07b4987
      YOMIKOE_AUDIO_FORMAT: opus
      HF_HOME: /hf_home
    restart: unless-stopped

volumes:
  yomikoe_data:
  hf_home:
