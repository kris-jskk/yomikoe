[project]
name = "hearnarro"
version = "0.1.0"
description = "Speechify-style PDF reader backed by open TTS models"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pysbd>=0.3",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "reportlab==4.4.10",  # BSD-3; soak fixture generator only (M4 gate)
]
# D15: Kokoro-82M on PyTorch CPU without the GPL/LGPL chain. The `kokoro` package itself is
# NOT a dependency (it declares misaki[en] -> phonemizer/espeak/num2words); its Apache-2.0 model
# code is vendored in hearnarro/synthesis/kokoro_model/. misaki is installed WITHOUT extras.
# The OOV predictor (g2p_en, Apache-2.0) is vendored in hearnarro/synthesis/g2p_oov/ because the
# g2p_en distribution depends on `distance` (GPL). inflect backs compat/num2words.py.
tts = [
    "torch>=2.4",
    "transformers>=4.40",
    "misaki==0.9.4",
    "spacy>=3.8,<3.9",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "inflect>=7",
]
# D16: optional Ogg Opus encoder (HEARNARRO_AUDIO_FORMAT=opus). opuscodec is Apache-2.0 and
# bundles libopus (BSD-3-Clause); WAV stays the default so the base install needs nothing extra.
opus = [
    "opuscodec==0.1.3",
]
# D31/D34: tier-1 evals only (EVAL-5/6). faster-whisper is MIT (ctranslate2 MIT, onnxruntime
# MIT, av BSD-3, tokenizers/huggingface-hub Apache-2.0); weights pinned in settings.py.
evals = [
    "faster-whisper==1.2.1",
]
ocr = [
    "pytesseract>=0.3",
    "pillow>=10",
]

[project.scripts]
hearnarro = "hearnarro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hearnarro*"]

[tool.setuptools.package-data]
"hearnarro.synthesis.g2p_oov" = ["checkpoint20.npz", "LICENSE", "NOTICE"]
"hearnarro.synthesis.kokoro_model" = ["LICENSE", "NOTICE"]
"hearnarro.synthesis.cmudict" = ["cmudict.dict.gz", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored third-party code is kept byte-close to upstream.
extend-exclude = ["hearnarro/synthesis/kokoro_model"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
