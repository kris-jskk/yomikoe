# Alembic config for the HearNarro SQLite schema (D7). Run from api/:
#   HEARNARRO_DATA_DIR=./data alembic upgrade head
# sqlalchemy.url is left empty: env.py builds it from HEARNARRO_DATA_DIR (default ./data).
# The app runs the same migrations programmatically in its lifespan (hearnarro.storage.db).

[alembic]
script_location = %(here)s/hearnarro/storage/migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
